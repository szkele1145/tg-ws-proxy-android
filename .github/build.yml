name: Build APK

# 什么时候触发编译
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:      # 允许在 GitHub 网页上手动点按钮编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 注意：这里【故意】不装 Rust、不编译 .so
      # 因为仓库里已经有预编译好的 libtgwsproxy.so：
      #   app/src/main/jniLibs/arm64-v8a/libtgwsproxy.so
      #   app/src/main/jniLibs/armeabi-v7a/libtgwsproxy.so
      # 所以整个编译只需要 JDK + Android SDK
      # ---------------------------------------------------------------

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      # 没有 keystore 时，仓库自带的 build.gradle.kts 会自动退回 debug 签名，
      # 所以这里不配置任何密钥也能出可安装的 APK。
      - name: 编译 arm64 版 APK
        run: ./gradlew assembleArm64Release --no-daemon

      - name: 编译 universal 版 APK
        run: ./gradlew assembleUniversalRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: tgws-chs-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
