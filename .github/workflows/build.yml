name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 生成 gradlew 与 local.properties
        run: |
          cat > gradlew <<'EOF'
          #!/bin/sh
          DIR=$(cd "$(dirname "$0")" && pwd)
          exec java -Xmx2g \
            -classpath "$DIR/gradle/wrapper/gradle-wrapper.jar" \
            -Dorg.gradle.appname=gradlew \
            org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > local.properties
          ./gradlew --version

      - name: 生成签名用 keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias tgws \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass tgws123456 \
            -keypass tgws123456 \
            -dname "CN=tgws-chs, OU=dev, O=dev, L=City, ST=State, C=CN"

          cat >> local.properties <<'EOF'
          KEYSTORE_FILE=../release.keystore
          KEYSTORE_PASSWORD=tgws123456
          KEY_ALIAS=tgws
          KEY_PASSWORD=tgws123456
          EOF
          cat local.properties

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 编译 APK（release，已签名，不含 LeakCanary）
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 列出产物
        if: always()
        run: find app/build/outputs -name "*.apk" -exec ls -lh {} \; || echo "没有找到 APK"

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgws-chs-apk-release
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
