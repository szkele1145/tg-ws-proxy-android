name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 定位 Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -d /usr/local/lib/android/sdk 2>/dev/null || true

      - name: 生成 gradlew 与 local.properties
        run: |
          cat > gradlew <<'EOF'
          #!/bin/sh
          DIR=$(cd "$(dirname "$0")" && pwd)
          exec java -Xmx2g \
            -classpath "$DIR/gradle/wrapper/gradle-wrapper.jar" \
            -Dorg.gradle.appname=gradlew \
            org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > local.properties
          ./gradlew --version

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 用 assembleDebug：release 没 keystore 会产出未签名 APK
      - name: 编译 APK（debug 签名）
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 列出产物
        if: always()
        run: find app/build/outputs -name "*.apk" -exec ls -lh {} \; || true

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgws-chs-apk-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
